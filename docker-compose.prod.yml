services:
  # Backend Python AI/ML Pipeline
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gaia-backend-prod
    command: uvicorn backend.python.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "${PORT:-8000}:8000"  # DigitalOcean App Platform sets PORT env var
    environment:
      # Cloud Supabase connection (from .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - CLIMATE_NLI_MODEL_PATH=${CLIMATE_NLI_MODEL_PATH:-MoritzLaurer/deberta-v3-base-zeroshot-v1.1-all-33}
      - GEO_NER_MODEL_PATH=${GEO_NER_MODEL_PATH:-dslim/bert-base-NER}
      - MIN_CONFIDENCE_THRESHOLD=${MIN_CONFIDENCE_THRESHOLD:-0.7}
      - CITIZEN_REPORT_CONFIDENCE=${CITIZEN_REPORT_CONFIDENCE:-0.3}
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS:-https://agaila-ph.vercel.app,https://agaila.me}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RSS_FEEDS=${RSS_FEEDS:-https://www.gmanetwork.com/news/rss/news/}
      # Field Encryption (RA 10173 - Philippine Data Protection Act)
      - GAIA_ENCRYPTION_KEY=${GAIA_ENCRYPTION_KEY}
      - GAIA_ENCRYPTION_SALT=${GAIA_ENCRYPTION_SALT}
      # SMS Notification (CR-06)
      - AWS_SNS_REGION=${AWS_SNS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SNS_TOPIC_ARN=${AWS_SNS_TOPIC_ARN}
    volumes:
      - ai-models:/app/models  # Named volume for AI models cache
    networks:
      - gaia-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # AI model download + loading can take 5+ min on first run

  # Frontend React PWA (Production Build with Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gaia-frontend-prod
    ports:
      - "3000:80"  # Nginx serves on port 80 internally
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://backend:8000}
      - REACT_APP_SUPABASE_URL=${SUPABASE_URL}
      - REACT_APP_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - REACT_APP_RECAPTCHA_SITE_KEY=${REACT_APP_RECAPTCHA_SITE_KEY}
    networks:
      - gaia-network
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Redis (Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: gaia-redis-prod
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis-data:/data
    networks:
      - gaia-network
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Celery Worker (Background Tasks)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gaia-celery-worker-prod
    command: celery -A backend.python.celery_worker.celery_app worker --loglevel=info --concurrency=2
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENV=production
      - CLIMATE_NLI_MODEL_PATH=${CLIMATE_NLI_MODEL_PATH:-MoritzLaurer/deberta-v3-base-zeroshot-v1.1-all-33}
      - GEO_NER_MODEL_PATH=${GEO_NER_MODEL_PATH:-dslim/bert-base-NER}
      - RSS_FEEDS=${RSS_FEEDS:-https://www.gmanetwork.com/news/rss/news/}
      # SMS Notification (CR-06)
      - AWS_SNS_REGION=${AWS_SNS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SNS_TOPIC_ARN=${AWS_SNS_TOPIC_ARN}
    volumes:
      - ai-models:/app/models
    networks:
      - gaia-network
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gaia-celery-beat-prod
    command: celery -A backend.python.celery_worker.celery_app beat --loglevel=info
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENV=production
      # SMS Notification (CR-06)
      - AWS_SNS_REGION=${AWS_SNS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SNS_TOPIC_ARN=${AWS_SNS_TOPIC_ARN}
    networks:
      - gaia-network
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  gaia-network:
    driver: bridge

volumes:
  ai-models:
    driver: local
  redis-data:
    driver: local

